# What this aircraft registers at boot. After editing, run ./deploy.sh on the
# drone: it checks, builds, and enables one jl_mission@<file> service per
# mission below, then reports readiness.
#
# airframe: what is on this aircraft (cameras and mounts): a name from
#           src/jl_flight/jl_flight/airframes.py.
# missions: Python files in missions/ -- each appears in QGC under its @mission name,
#           and starts the trackers it declares itself.
# helpers:  other boot services the aircraft needs: vio, battery_monitor, and
#           aruco_tracker (for the C++ precision_land modes only).
#           A helper left out here is stopped and disabled by deploy.sh.
airframe: realsense_drone
missions:
  - missions/takeoff_hold_land.py
  - missions/apriltag_approach.py
helpers: [vio, battery_monitor]
