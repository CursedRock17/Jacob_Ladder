# Lint, type-check and unit-test the mission blocks on every branch push.
# Push checks also appear on PRs opened from branches in this repository.
# Runs the same `make check` developers run locally; the tool versions are
# pinned in mise.toml. No ROS is needed: jl_blocks.core is plain Python.
name: check

on:
  push:
    branches:
      - '**'

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run check
      - run: make check
