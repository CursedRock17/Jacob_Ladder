drone_smooth_planner:
  ros__parameters:
    # Two-stage in-mode takeoff
    # Stage 1: climb to a low altitude and hold so optical flow can initialize.
    takeoff_optical_flow_height: 0.50        # meters above the arm position
    takeoff_optical_flow_hold_time: 3.0      # seconds to hold after reaching the height
    takeoff_optical_flow_reached_tol: 0.05   # meters — tolerance for starting the hold timer

    # Stage 2: climb from the optical-flow height to the final takeoff height.
    # All heights are relative to the arm position; XY remains fixed.
    takeoff_height: 0.750       # meters above the arm position
    climb_rate: 0.3             # m/s — vertical climb speed during the final climb
    takeoff_reached_tol: 0.05   # meters — altitude tolerance to finish takeoff

    # S-curve trajectory generation
    num_waypoints: 10           # number of points along the S-curve
    s_curve_steepness: 4.0      # tanh steepness — higher = sharper transition
    waypoint_tolerance_m: 0.15  # meters — distance to consider a waypoint reached
    max_velocity: 0.5           # m/s — velocity clamp for the profile
    max_acceleration: 0.35      # m/s^2 — acceleration clamp for the profile
    replan_threshold: 0.35      # meters — replan if the NED target moves more than this
    replan_min_interval: 0.5    # seconds — minimum time between replans
    camera_pitch_deg: 0.0       # forward YOLO camera pitch; positive = tilted down [deg]
    hover_duration: 1.5         # seconds — hover at the drogue before completing
    drogue_timeout: 3.0         # seconds — maximum drogue pose age before it is considered lost