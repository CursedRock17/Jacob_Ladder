drone_smooth_planner:
  ros__parameters:
    # In-mode takeoff (climb is relative to the arm position; XY is held fixed)
    takeoff_height: 0.750        # meters to climb above the arm position
    climb_rate: 0.3             # m/s — vertical climb speed
    takeoff_reached_tol: 0.10   # meters — altitude tolerance to finish the climb

    # S-curve trajectory generation
    num_waypoints: 10           # number of points along the S-curve
    s_curve_steepness: 4.0      # tanh steepness — higher = sharper transition
    waypoint_tolerance_m: 0.15  # meters — distance to consider a waypoint reached
    max_velocity: 0.5           # m/s — velocity clamp for the profile
    max_acceleration: 0.35      # m/s^2 — acceleration clamp for the profile
    replan_threshold: 0.35      # meters — replan if the NED target moves more than this
    replan_min_interval: 0.5    # seconds — minimum time between replans (rate limit)
    camera_pitch_deg: 0.0       # forward YOLO cam mount pitch, +ve = tilted down [deg]
    hover_duration: 1.5         # seconds — hover at the drogue before completing
    drogue_timeout: 3.0         # seconds — max age of a drogue pose before it is lost
