drone_smooth_planner:
  ros__parameters:
    # Two-stage in-mode takeoff
    # Stage 1: climb to a low altitude and hold so optical flow can initialize.
    takeoff_optical_flow_height: 0.25        # meters above the arm position
    takeoff_optical_flow_hold_time: 1.0      # seconds to hold after reaching the height
    takeoff_optical_flow_reached_tol: 0.05   # meters — tolerance for starting the hold timer

    # Stage 2: climb from the optical-flow height to the final takeoff height.
    # All heights are relative to the arm position; XY remains fixed.
    takeoff_height: 1.750       # meters above the arm position
    climb_rate: 0.25             # m/s — vertical climb speed during the final climb
    takeoff_reached_tol: 0.05   # meters — altitude tolerance to finish takeoff

    # Drogue approach
    # The vehicle flies to a standoff point rather than the drogue itself: it holds
    # drogue_standoff_m of horizontal separation while matching the drogue's altitude.
    # This is the guard against flying into the drogue — do not set it to 0.
    drogue_standoff_m: 3.0      # meters — horizontal standoff held from the drogue

    # The setpoint is a single waypoint recomputed each tick, placed carrot_lead_time
    # ahead of the vehicle along the bearing to the standoff point. PX4's position
    # controller closes the loop, so no trajectory is precomputed here.
    carrot_lead_time: 1.0       # seconds — how far ahead the setpoint leads the vehicle
    waypoint_tolerance_m: 0.15  # meters — distance to consider the standoff point reached
    max_velocity: 0.5           # m/s — approach speed cap (velocity feed-forward)
    camera_pitch_deg: 0.0       # forward YOLO camera pitch; positive = tilted down [deg]
    hover_duration: 1.5         # seconds — hover at the standoff point before completing
    drogue_timeout: 3.0         # seconds — maximum drogue pose age before it is considered lost
