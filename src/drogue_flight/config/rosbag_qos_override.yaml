# QoS overrides for ros2 bag record.
# PX4 topics come through XRCE-DDS with history: UNKNOWN / depth: 0,
# which causes RTPS_HISTORY errors in the recorder's subscriber.
# Override them to BEST_EFFORT + KEEP_LAST so the recorder can subscribe cleanly.

/fmu/out/airspeed_validated:
  history: keep_last
  depth: 10
  reliability: best_effort
  durability: volatile

