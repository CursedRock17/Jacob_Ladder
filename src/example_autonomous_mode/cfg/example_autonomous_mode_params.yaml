# Parameters for the example autonomous mode.
#
# The top-level key must match the node name set in the launch file, otherwise
# ROS 2 silently ignores the file and the mode runs on the defaults compiled
# into ExampleAutonomousMode.hpp.
example_autonomous_mode:
  ros__parameters:
    # How long to hover before descending
    hold_duration: 7.5
    # Downward speed during the landing descent
    descent_vel: 0.5
    # Height above the observed ground plane where controlled descent hands off
    # to PX4-native landing
    landing_height: 0.10
