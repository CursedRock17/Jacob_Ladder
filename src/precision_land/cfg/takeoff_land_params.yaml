takeoff_land:
  ros__parameters:
    optical_flow_height: 0.25
    optical_flow_hold_time: 3.0
    target_height: 1.0
    climb_rate: 0.3
    delta_position: 0.05
    hold_duration: 10.0        # seconds to hover at target before landing (mode)
    descent_rate: 0.3          # m/s setpoint descent after hover (gentler than MPC_LAND_SPEED's 0.6 min)
    land_handoff_height: 0.3   # meters above ground where land() takes over for touchdown
    safety_timeout: 30.0      # executor lands anyway if the mode never completes
